plugins {
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'com.diffplug.eclipse.apt' version '4.4.1' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0' apply false
}

tasks.register('publishMods') {
    def tasks = [
        project(':PatchedMod.Forge.1.18.2').tasks.publishMods,
        project(':PatchedMod.Fabric.1.18.2').tasks.publishMods,
        project(':PatchedMod.Forge.1.19.2').tasks.publishMods,
        project(':PatchedMod.Fabric.1.19.2').tasks.publishMods,
        project(':PatchedMod.Forge.1.20.1').tasks.publishMods,
        project(':PatchedMod.Fabric.1.20.1').tasks.publishMods,
        project(':PatchedMod.NeoForge.1.21.1').tasks.publishMods,
        project(':PatchedMod.Fabric.1.21.1').tasks.publishMods,
        project(':PatchedMod.NeoForge.1.21.11').tasks.publishMods,
        project(':PatchedMod.Fabric.1.21.11').tasks.publishMods,
        project(':PatchedMod.NeoForge.26.1').tasks.publishMods,
        project(':PatchedMod.Fabric.26.1').tasks.publishMods,
        project(':PatchedMod.NeoForge.26.3').tasks.publishMods,
        project(':PatchedMod.Fabric.26.3').tasks.publishMods
    ]

    for (int i = 0; i < tasks.size() - 1; i++) {
        tasks[i + 1].mustRunAfter(tasks[i])
    }

    dependsOn(tasks)
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'eclipse'
    //apply plugin: 'com.diffplug.eclipse.apt'

    base {
        archivesName = 'Patched'
    }

    group = 'net.enderturret'
    version = "${mod_version}+${loader}"

    java.withSourcesJar()

    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            url = 'https://api.modrinth.com/maven'
            content {
                includeGroup 'maven.modrinth'
            }
        }
        maven {
            url = 'https://jitpack.io'
            content {
                includeGroup 'com.github.EnderTurret'
            }
        }
    }

    configurations {
        shadow
        sourceShadow
    }

    dependencies {
        shadow (implementation("com.github.EnderTurret:Patched:$patched_version")) {
            exclude group: 'com.google.code.gson', module: 'gson'
        }
        sourceShadow ("com.github.EnderTurret:Patched:$patched_version:sources") {
            exclude group: 'com.google.code.gson', module: 'gson'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    }

    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }

    tasks.named('processResources', ProcessResources).configure {
        doLast {
            fileTree(dir: outputs.files.asPath, include: '**/*.json').each {
                File file -> file.text = groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(file))
            }
        }
    }

    tasks.named('jar', Jar).configure {
        manifest {
            attributes([
                'Specification-Title': 'Patched',
                'Specification-Vendor': 'EnderTurret',
                'Specification-Version': '1',
                'Implementation-Title': 'Patched',
                'Implementation-Version': "${version}",
                'Implementation-Vendor': 'EnderTurret'
            ])
        }
    }

    tasks.named('jar', Jar).configure {
        // Add the Patched library to the built jar.
        dependsOn configurations.shadow
        from {
            configurations.shadow.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
        }

        from (rootDir) {
            include 'LICENSE-small.txt'
        }

        exclude 'net/enderturret/patchedmod/forge/data/**'
    }

    tasks.named('sourcesJar', Jar).configure {
        // Add the Patched library sources to the built jars' sources.
        dependsOn configurations.sourceShadow
        from {
            configurations.sourceShadow.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
        }

        from (rootDir) {
            include 'LICENSE-small.txt'
        }
    }

    if (it != project(':PatchedMod.Common')) {
        dependencies {
            implementation (project(':PatchedMod.Common'))
        }

        tasks.named('compileJava', JavaCompile).configure {
            source project(':PatchedMod.Common').sourceSets.main.allSource
        }

        tasks.named('sourcesJar', Jar).configure {
            from project(':PatchedMod.Common').sourceSets.main.allJava
        }

        tasks.named('processResources', ProcessResources).configure {
            from project(':PatchedMod.Common').sourceSets.main.resources
        }

        apply plugin: 'me.modmuss50.mod-publish-plugin'

        publishMods {
            changelog = providers.fileContents(rootProject.getLayout().projectDirectory.file("changelog.md")).asText
            type = STABLE
            modLoaders.add("${publishing_loader}")
            displayName = "${project.version}"

            dryRun = true

            curseforge {
                accessToken = providers.gradleProperty('CURSEFORGE_API_KEY')
                projectId = '689918'
                changelogType = 'markdown'

                additionalFiles.from(sourcesJar.archiveFile)

                minecraftVersionList("${publishing_minecraft_version_range}")
                javaVersions.add(JavaVersion.valueOf("${publishing_java_version}"))

                client = true
                server = true

                if (project.hasProperty("publishing_mixin_dep_cf")) {
                    requires("${publishing_mixin_dep_cf}")
                }
            }

            modrinth {
                accessToken = providers.gradleProperty('MODRINTH_API_KEY')
                projectId = 'IBlGrJtC'

                additionalFile(sourcesJar) {
                    type = SOURCES_JAR
                }

                minecraftVersionList("${publishing_minecraft_version_range}")

                environment = CLIENT_OR_SERVER_PREFERS_BOTH

                if (project.hasProperty("publishing_mixin_dep_mr")) {
                    requires("${publishing_mixin_dep_mr}")
                }
            }
        }
    }
}